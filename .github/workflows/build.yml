name: Build DarkTrap

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: cargo

    - name: Restore dependencies
      run: dotnet restore

    - name: Publish app
      run: dotnet publish -c Release -r win-x64 -p:PublishAot=false --output ./publish

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: DarkTrap-Release
        path: ./publish
